


@for(depto of arraydepartamentos; track depto){
<div class="card" style="width: 18rem;">
  <ul class="list-group list-group-flush">
    <li class="list-group-item">
    <em>ID: </em> <span style="color: blue;">{{depto.idDepartamento}}</span></li>
    <li class="list-group-item">
    <em>Localidad: </em> <span style="color: blue;">{{depto.localidad}}</span></li>
    <li class="list-group-item"><em>Departamento: 
    </em> <span style="color: blue;">{{depto.nombre}}</span></li>
    <li class="list-group-item"><a [routerLink]="['/eliminar', depto.idDepartamento]" class="btn btn-danger">Delete</a></li>
    <li class="list-group-item"><a [routerLink]="['/update', depto.idDepartamento]" class="btn btn-warning">Update</a></li>
    
  </ul>
</div>
<br/>
}
